      why: it covers 100 per cent of a page at the 27.66 by 10.31 inches the file states, and the cap is 75 per cent
      caption: '(**Overview**.) Structured SSMs independently map each channel (e.g. $D=5$) of an input $x$ to output $y$ through a higher dimensional latent state $h$ (e.g. $N=4$). Prior SSMs avoid materializing this large effective state ($DN$, times batch size $B$ and sequence length $L$) through clever alternate computation paths requiring time-invariance: the $(\Delta,\bm{A},\bm{B},\bm{C})$ parameters are constant across time. Our selection mechanism adds back input-dependent dynamics, which also requires a careful hardware-aware algorithm to only materialize the expanded states in more efficient levels of the GPU memory hierarchy.'
      licence: cc-by
      fetched: 2026-09-14T18:47:53Z
