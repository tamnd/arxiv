      caption: (**Architecture**.) Our simplified block design combines the H3 block, which is the basis of most SSM architectures, with the ubiquitous MLP block of modern neural networks. Instead of interleaving these two blocks, we simply repeat the Mamba block homogenously. Compared to the H3 block, Mamba replaces the first multiplicative gate with an activation function. Compared to the MLP block, Mamba adds an SSM to the main branch. For $\sigma$ we use the SiLU / Swish activation ([Hendrycks & Gimpel, 2016](#bib.bibx48); [Ramachandran et al., 2017](#bib.bibx89)).
      licence: cc-by
      fetched: 2026-09-14T18:48:23Z
