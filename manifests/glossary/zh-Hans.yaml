# English to Simplified Chinese, scoped by field.
#
# Traditional Chinese is converted from this file's output rather than
# translated separately, so there is no zh-Hant glossary. The exception list for
# terms that genuinely differ between the two lives beside the converter.

version: 0
terms:
  - en: theorem
    zh-Hans: 定理
  - en: lemma
    zh-Hans: 引理
  - en: corollary
    zh-Hans: 推论
  - en: proposition
    zh-Hans: 命题
  - en: definition
    zh-Hans: 定义
  - en: proof
    zh-Hans: 证明
  - en: conjecture
    zh-Hans: 猜想
  - en: assumption
    zh-Hans: 假设

  - en: kernel
    scope: math.FA
    zh-Hans: 核
    note: "the null space sense"
  - en: kernel
    scope: cs.LG
    zh-Hans: 核函数
  - en: kernel
    scope: cs.OS
    zh-Hans: 内核

  - en: embedding
    scope: math.DG
    zh-Hans: 嵌入
  - en: embedding
    scope: cs.CL
    zh-Hans: 嵌入向量

  - en: manifold
    scope: math
    zh-Hans: 流形
  - en: neural network
    scope: cs
    zh-Hans: 神经网络
  - en: gradient descent
    scope: cs
    zh-Hans: 梯度下降
  - en: attention
    scope: cs.CL
    zh-Hans: 注意力
